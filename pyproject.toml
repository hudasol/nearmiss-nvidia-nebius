[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nearmiss"
version = "0.1.0"
description = "Replay-to-Redesign: physical simulation experiments for warehouse safety interventions"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
nearmiss = "nearmiss.cli:main"

[tool.setuptools.packages.find]
include = ["nearmiss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Nebius Token Factory API (needs NEBIUS_API_KEY)",
    "slow: dense sweeps that take more than a few seconds",
]
addopts = "-m 'not live'"
log_level = "WARNING"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["nearmiss"]
